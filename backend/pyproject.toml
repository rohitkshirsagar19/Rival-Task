[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "email-validator",
    "fastapi",
    "passlib[bcrypt]",
    "psycopg2-binary",
    "pydantic-settings",
    "python-jose",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]
