services:
  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    environment:
      APP_NAME: TaskFlow API
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+psycopg2://taskflow:taskflow@postgres:5432/taskflow
      AUTH_SECRET_KEY: change-me-in-production
      AUTH_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      AUTH_COOKIE_NAME: taskflow_access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/tasks
        NEXT_PUBLIC_SSE_URL: http://localhost:8000/api/v1/events/tasks
    container_name: taskflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
